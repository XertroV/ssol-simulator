name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-release-request:
    name: Verify release request
    runs-on: ubuntu-latest
    outputs:
      actor_allowed: ${{ steps.verify.outputs.actor_allowed }}
      on_master: ${{ steps.verify.outputs.on_master }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify actor and tag ancestry
        id: verify
        shell: bash
        run: |
          actor_normalized="$(printf '%s' "${GITHUB_ACTOR}" | tr '[:upper:]' '[:lower:]')"
          owner_normalized="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ "${actor_normalized}" != "${owner_normalized}" ]; then
            echo "Release workflow may only be triggered by the repository owner (${GITHUB_REPOSITORY_OWNER})" >&2
            echo "actor_allowed=false" >> "$GITHUB_OUTPUT"
            echo "on_master=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "actor_allowed=true" >> "$GITHUB_OUTPUT"
          git fetch origin master --depth=1
          if git branch -r --contains "$GITHUB_SHA" | grep -q "origin/master"; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on origin/master" >&2
            echo "on_master=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  define-matrix:
    name: Define build matrix
    needs: verify-release-request
    if: needs.verify-release-request.outputs.actor_allowed == 'true' && needs.verify-release-request.outputs.on_master == 'true'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.define.outputs.include }}
    steps:
      - id: define
        shell: bash
        run: |
          if [ "${GITHUB_SERVER_URL}" = "https://github.com" ]; then
            include='[{"name":"Linux x86_64","runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","binary":"target/release/ssol_simulator"},{"name":"Windows x86_64","runner":"windows-latest","target":"x86_64-pc-windows-msvc","binary":"target/release/ssol_simulator.exe"},{"name":"macOS arm64","runner":"macos-14","target":"aarch64-apple-darwin","binary":"target/release/ssol_simulator"}]'
          else
            include='[{"name":"Linux x86_64","runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","binary":"target/release/ssol_simulator"}]'
          fi
          echo "include=${include}" >> "$GITHUB_OUTPUT"
          echo "Using matrix: ${include}"
          echo "GITHUB_SERVER_URL=${GITHUB_SERVER_URL}"

  build:
    name: ${{ matrix.name }}
    needs: define-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-matrix.outputs.include) }}
    env:
      CI_S3_ENDPOINT: ${{ secrets.CI_S3_ENDPOINT }}
      CI_S3_BUCKET: ${{ secrets.CI_S3_BUCKET }}
      CI_S3_ACCESS_KEY: ${{ secrets.CI_S3_ACCESS_KEY }}
      CI_S3_SECRET_KEY: ${{ secrets.CI_S3_SECRET_KEY }}
      CI_S3_REGION: ${{ secrets.CI_S3_REGION }}
      CI_S3_USE_SSL: ${{ secrets.CI_S3_USE_SSL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Third-party actions are not mirrored on data.forgejo.org; full GitHub URLs
      # work on both Forgejo act_runner and GitHub-hosted runners.
      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Cache Rust build outputs (GitHub)
        if: ${{ github.server_url == 'https://github.com' }}
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: ssol-release
          cache-on-failure: "true"

      - name: Configure Rust cache (Forgejo / self-hosted)
        if: ${{ github.server_url != 'https://github.com' }}
        shell: bash
        run: |
          chmod +x scripts/ci_setup_rust_cache.sh scripts/ci_report_rust_cache.sh
          scripts/ci_setup_rust_cache.sh "${{ matrix.target }}"

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked

      - name: Report Rust cache stats
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -x scripts/ci_report_rust_cache.sh ]; then
            scripts/ci_report_rust_cache.sh
          fi

      - name: Package archive
        shell: bash
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ] && [ ! -e "${{ matrix.binary }}" ]; then
            mkdir -p "$(dirname "${{ matrix.binary }}")"
            cp -a "${CARGO_TARGET_DIR}/release/$(basename "${{ matrix.binary }}")" "${{ matrix.binary }}"
          fi
          python3 scripts/package_release.py \
            --target ${{ matrix.target }} \
            --version ${{ github.ref_name }} \
            --binary ${{ matrix.binary }} \
            --output-dir dist

      - name: Upload packaged artifact (GitHub)
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload packaged artifact (Forgejo)
        if: ${{ github.server_url != 'https://github.com' }}
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: release-bundle-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish draft release
    runs-on: ubuntu-latest
    needs: build
    # softprops targets the GitHub Releases API; only run on github.com.
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && github.server_url == 'https://github.com' }}

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: dist

      - name: Create draft GitHub release
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
