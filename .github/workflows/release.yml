name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-release-request:
    name: Verify release request
    runs-on: ubuntu-latest
    outputs:
      actor_allowed: ${{ steps.verify.outputs.actor_allowed }}
      on_master: ${{ steps.verify.outputs.on_master }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify actor and tag ancestry
        id: verify
        shell: bash
        run: |
          actor_normalized="$(printf '%s' "${GITHUB_ACTOR}" | tr '[:upper:]' '[:lower:]')"
          owner_normalized="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ "${actor_normalized}" != "${owner_normalized}" ]; then
            echo "Release workflow may only be triggered by the repository owner (${GITHUB_REPOSITORY_OWNER})" >&2
            echo "actor_allowed=false" >> "$GITHUB_OUTPUT"
            echo "on_master=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "actor_allowed=true" >> "$GITHUB_OUTPUT"
          git fetch origin master --depth=1
          if git branch -r --contains "$GITHUB_SHA" | grep -q "origin/master"; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on origin/master" >&2
            echo "on_master=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: verify-release-request
    if: needs.verify-release-request.outputs.actor_allowed == 'true' && needs.verify-release-request.outputs.on_master == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Forgejo self-hosted runner currently provides Linux only.
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/release/ssol_simulator

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Third-party actions are not mirrored on data.forgejo.org; use full GitHub URLs.
      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Cache Rust build outputs
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked

      - name: Package archive
        shell: bash
        run: |
          python3 scripts/package_release.py \
            --target ${{ matrix.target }} \
            --version ${{ github.ref_name }} \
            --binary ${{ matrix.binary }} \
            --output-dir dist

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish draft release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: dist

      # softprops is not on the Forgejo action mirror; pin to GitHub.
      # On Forgejo this uses the GITHUB_TOKEN against the Forgejo API (compatible subset).
      - name: Create draft release
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
