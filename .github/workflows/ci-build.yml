name: CI Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    # Windows/macOS use GitHub-hosted runners. Forgejo only has a Linux runner, so
    # those matrix rows are skipped there (otherwise they sit forever in "waiting").
    if: ${{ matrix.host != 'github' || github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            host: any
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/release/ssol_simulator
          - name: Windows x86_64
            host: github
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/ssol_simulator.exe
          - name: macOS arm64
            host: github
            runner: macos-14
            target: aarch64-apple-darwin
            binary: target/release/ssol_simulator

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Third-party actions are not mirrored on data.forgejo.org; full GitHub URLs
      # work on both Forgejo act_runner and GitHub-hosted runners.
      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Cache Rust build outputs
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Determine CI version label
        id: version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$(python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          cargo = Path("Cargo.toml")
          cargo_text = cargo.read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', cargo_text, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not determine package version from Cargo.toml")
          version = match.group(1)
          print(f"{version}-ci.{os.environ['RUN_NUMBER']}")
          PY
          )"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked

      - name: Package archive
        shell: bash
        run: |
          python3 scripts/package_release.py \
            --target ${{ matrix.target }} \
            --version ${{ steps.version.outputs.value }} \
            --binary ${{ matrix.binary }} \
            --output-dir dist

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-bundle-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
